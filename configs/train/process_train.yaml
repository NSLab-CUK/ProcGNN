# --- 기본 최적???�정 ---
epochs: 200                    # ?�체 ?�습 epoch ?? ?�션: 50, 100, 200, 300
batch_size: 16                 # 미니배치 ?�기(그래????. ?�션: 4, 8, 16, 32
learning_rate: 0.00045        # ?�티마이? ?�습�? ?�션: 1e-4, 5e-4, 1e-3
