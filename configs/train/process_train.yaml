scheduler_patience: 10         # 개선 ?�을 ???�?epoch ?? plateau ?�용
scheduler_factor: 0.5          # plateau ???�습�?�?배율. plateau ?�용
scheduler_min_lr: 1.0e-6       # ?�습�??�한?? plateau ?�용

# --- ?�실 / ?�규??(?�로?�트 ?�일: smooth_l1 / Huber) ---
gradient_clip_norm: 1.0        # 그래?�언???�립 ?�계�?0?�면 비활??. ?�션: 0.0, 1.0, 5.0, 10.0
loss_type_target: smooth_l1    # ?�션: mse, l1, smooth_l1, percentage
