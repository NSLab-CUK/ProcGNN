        - Frac_CH4
        - Frac_CO
        - Frac_CO2
        - Frac_H2
        zero_threshold: 1.0e-08
        positive_quantiles:
        - 0.0
        - 0.5
        - 0.9
        - 1.0
      quantile_balance:
