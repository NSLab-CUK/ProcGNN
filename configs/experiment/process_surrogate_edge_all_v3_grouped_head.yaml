    primary_frac_r2_loss_cap: 5.0      # R2 loss 媛믪쓣 ??媛믪쑝濡?cap. ??텧?섎줉 ?덉젙?곸씠怨? ?믪씪?섎줉 R2 吏곸젒 ?뺣컯??媛뺥븿

